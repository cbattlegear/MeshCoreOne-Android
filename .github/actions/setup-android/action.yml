name: Set up Android build
description: JDK 21, Python 3.12, the Android SDK packages the build needs, and a Gradle cache. Run after actions/checkout.

inputs:
  save-cache:
    description: Allow a build/producer job to save reusable Gradle state. Room follow-ups and benchmarks only restore.
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: "21"

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.12"

    - name: Ensure Android SDK packages
      shell: bash
      run: |
        sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        missing=()
        for package in "platforms;android-37.2" "build-tools;37.0.0"; do
          [ -d "$sdk/${package//;//}" ] || missing+=("$package")
        done
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "Installing missing SDK packages: ${missing[*]}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" "${missing[@]}"
        fi
        echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"

    - name: Set up deduplicated Gradle cache
      uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      with:
        cache-read-only: ${{ inputs.save-cache != 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        cache-cleanup: on-success
        dependency-graph: disabled
        build-scan-publish: false
