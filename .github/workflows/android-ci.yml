name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xms64m -Xmx3072m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8"'

jobs:
  source-checks:
    name: Source and tooling checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      android: ${{ steps.scope.outputs.android }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Select expensive checks
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python tools/android-port/ci_scope.py --event "$CI_EVENT" --base "$PR_BASE"
      - name: Frozen source vectors
        run: python tools/android-port/extract_vectors.py --check
      - name: Source provenance headers
        run: python tools/android-port/portmap.py
      - name: Bundled notices
        run: python android/scaffold/sync_notices.py
      - name: Python oracle unit tests
        working-directory: tools/android-port
        run: python -m unittest discover -s oracle -t .

  build:
    name: Linux build and tests
    needs: [source-checks]
    if: ${{ needs.source-checks.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - name: Gradle build and tests
        working-directory: android
        env:
          JAVA_OPTS: -Xms32m -Xmx128m
          CHECK_DEPENDENCIES: ${{ needs.source-checks.outputs.dependencies }}
        run: |
          tasks=(verifyScaffoldTests validateModuleGraph
            runtimeDependencyInventory lintScaffold
            :app:assembleDebug :app:compileDebugAndroidTestKotlin
            :app:compileDebugUnitTestKotlin
            :core:testing:testDebugUnitTest)
          if [ "$CHECK_DEPENDENCIES" = true ]; then
            tasks+=(resolveScaffoldDependencies)
          fi
          ./gradlew --no-daemon --continue --console=plain --stacktrace --profile \
            --dependency-verification strict --build-cache --parallel --max-workers=3 \
            -Pkotlin.compiler.execution.strategy=in-process -PscaffoldTestHeap=1g -PscaffoldExternalAppTests=true \
            "${tasks[@]}"
      - name: Upload generated Room schemas
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: room-schemas
          path: android/core/database/schemas/
          if-no-files-found: warn
          retention-days: 14
      - name: Inspect the debug APK
        run: python android/scaffold/inspect_apk.py
      - name: Upload debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Upload test results and task timings
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-reports
          path: |
            android/**/build/test-results/**/*.xml
            android/build/reports/profile/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  app-tests:
    name: App tests (${{ matrix.shard }}/4)
    needs: [source-checks, build]
    if: ${{ needs.source-checks.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-android
        with:
          save-cache: "false"
      - name: Run the assigned compiled app classes and require actual results
        working-directory: android
        env:
          JAVA_OPTS: -Xms32m -Xmx128m
          APP_TEST_SHARD: ${{ matrix.shard }}
        run: |
          ./gradlew --no-daemon --console=plain --stacktrace --profile \
            --dependency-verification strict --build-cache --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process -PscaffoldTestHeap=1g \
            -PscaffoldAppTestForks=2 -PscaffoldAppTestShard="$APP_TEST_SHARD/4" \
            verifyAppTestResults
      - name: Upload shard results and task timings
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: app-test-reports-${{ matrix.shard }}
          path: |
            android/app/build/test-results/**/*.xml
            android/build/reports/profile/
          if-no-files-found: error
          retention-days: 7

  benchmark-harness:
    name: Benchmark harness (main and manual runs)
    needs: [source-checks]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-android
        with:
          save-cache: "false"
      - name: Gradle benchmark harness
        working-directory: android
        env:
          JAVA_OPTS: -Xms32m -Xmx128m
        run: >-
          ./gradlew
          --no-daemon --console=plain --stacktrace
          --dependency-verification strict
          --build-cache --parallel --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
          -PscaffoldTestHeap=512m
          :benchmark:verifyBenchmarkHarness validateModuleGraph

  android-ci:
    name: android-ci
    if: ${{ !cancelled() }}
    needs: [source-checks, build, app-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Selected Android checks must succeed
        env:
          SOURCE: ${{ needs.source-checks.result }}
          BUILD: ${{ needs.build.result }}
          APP_TESTS: ${{ needs.app-tests.result }}
          RUN_ANDROID: ${{ needs.source-checks.outputs.android }}
        run: |
          [ "$SOURCE" = success ] || { echo "::error::Source checks did not succeed"; exit 1; }
          case "$RUN_ANDROID" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) echo "::error::Invalid Android build selection"; exit 1 ;;
          esac
          echo "build: $BUILD (expected $expected)"
          [ "$BUILD" = "$expected" ] || { echo "::error::Android build did not produce $expected"; exit 1; }
          [ "$APP_TESTS" = "$expected" ] || { echo "::error::App tests did not produce $expected"; exit 1; }
