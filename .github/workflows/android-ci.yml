          environment.update({"ROOM_V4_EVENTS": str(events), "ROOM_V4_HEAD": bound["diagnostic_sha"],
                              "ROOM_V4_PROJECT": str((repo / "android").resolve()),
                              "ROOM_V4_RUN": bound["run_id"], "ROOM_V4_ATTEMPT": bound["run_attempt"]})
          command = [str(repo / "android" / "gradlew"), "-p", str(repo / "android"), task,
                     "--no-daemon", "--console=plain", "--dependency-verification", "strict",
                     "--rerun-tasks", "--no-build-cache", "--no-configuration-cache", "--max-workers=2",
                     "-Pkotlin.compiler.execution.strategy=in-process", "-Pksp.incremental=false",
                     "--project-cache-dir", str(directory / "project-cache"), "--init-script", str(init)]
          log = directory / "ksp-original.log"
          execute(command, environment, log, timeout=1800, stream_output=True)
          rows = [parse_json(line) for line in events.read_text(encoding="utf-8").splitlines()]
          validate_execution(rows, bound)
          observations = [line.strip() for line in log.read_text(encoding="utf-8").splitlines()
                          if re.match(r"^> Task :core:database:kspDebugKotlin(?:\s|$)", line.strip())]
          if not observations or any(item != "> Task " + task for item in observations):
              raise RuntimeError("KSP original log lacks successful unsuffixed task observation")
          preserve_predecessors()
          data = read_v4(guard["started_ns"])
          receipt = {**bound, "process_exit_code": 0, "task": task, "execution_observations": rows,
                     "command": command, "schema_sha256": digest(data), "schema_size": len(data),
                     "ksp_log_sha256": digest(log.read_bytes()), "init_sha256": digest(init.read_bytes()),
                     "events_sha256": digest(events.read_bytes()), "finished_ns": time.time_ns(),
                     "task_heading_displays": observations, "guard": guard}
          (directory / "compiler.json").write_text(json.dumps(receipt), encoding="utf-8")
          print(json.dumps(receipt, sort_keys=True))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - id: gradle
        name: Run parallel Gradle validation and Android tasks
        env:
          RUN_SCAFFOLD: ${{ needs.scope.outputs.scaffold }}
          RUN_PROTOCOL: ${{ needs.scope.outputs.protocol }}
          RUN_BACKUP: ${{ needs.scope.outputs.backup }}
          RUN_CONTROLLER: ${{ needs.scope.outputs.controller }}
        run: |
          $scopes = @()
          if ($env:RUN_SCAFFOLD -eq 'true') { $scopes += @('--scope', 'scaffold') }
          if ($env:RUN_PROTOCOL -eq 'true') { $scopes += @('--scope', 'protocol') }
          if ($env:RUN_BACKUP -eq 'true') { $scopes += @('--scope', 'backup') }
          $affected = @()
          if ($env:RUN_CONTROLLER -ne 'true') { $affected = @('--affected-candidate') }
          & python tools/android-port/controller/ci.py run --stage scaffold @affected @scopes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate localization discovery
        if: ${{ steps.gradle.outputs.localization == 'true' }}
        run: >-
          python tools/android-port/l10n_convert.py --check
          --verify-android-tests android/core/l10n/build/test-results/testDebugUnitTest
      - name: Inspect exact APK and static alignment
        if: ${{ steps.gradle.outputs.full_scaffold == 'true' }}
        run: python tools/android-port/controller/ci.py inspect
      - name: Upload inspected debug APK for human testing
        if: ${{ success() && steps.gradle.outputs.full_scaffold == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: debug-apk-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Transfer actual backup bytes to the platform oracle
        if: ${{ needs.scope.outputs.backup == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backup-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: android/core/data/build/reports/wp203/interop/
          if-no-files-found: error
          retention-days: 1
      - id: room_v4_collect
        name: Collect exact unchanged compiler-generated Room v4
        if: ${{ always() && steps.room_v4_ksp.outcome == 'success' && (steps.gradle.outcome == 'success' || steps.gradle.outcome == 'failure') }}
        env:
          ROOM_DIAGNOSTIC_SHA: ${{ github.sha }}
          ROOM_KSP_OUTCOME: ${{ steps.room_v4_ksp.outcome }}
          ROOM_GRADLE_OUTCOME: ${{ steps.gradle.outcome }}
        run: |
          @'
          import hashlib, json, os, pathlib, re, subprocess, time
          repo = pathlib.Path.cwd()
          workflow = ".github/workflows/android-ci.yml"
          predecessors = {'1': {'path': 'android/core/database/schemas/com.meshcoreone.android.core.database.MeshCoreDatabase/1.json', 'blob': '0e6ce7706f75e08c4a70555178b2fdebb98f2184', 'sha256': 'c1962dd795e42bd4c7c0d199f65fa1558f02c4f6b0508693239fc72f26022229'}, '2': {'path': 'android/core/database/schemas/com.meshcoreone.android.core.database.MeshCoreDatabase/2.json', 'blob': '2a1c5c66d5c42b53b146becf2ed085cffee93f68', 'sha256': 'c8b324628f0ece66967c9ea9025567208bc23c4681f5973f72f7308d5cf732b2'}, '3': {'path': 'android/core/database/schemas/com.meshcoreone.android.core.database.MeshCoreDatabase/3.json', 'blob': 'e7bf0f62999896bca4d36a2a636096d962b12638', 'sha256': '4661fe56e21ac17c6b088fe794d0890294f01ac92825f321e36d1a067c78f28b'}}
          v4 = "android/core/database/schemas/com.meshcoreone.android.core.database.MeshCoreDatabase/4.json"
          source = "cc384eacc130a1e133a987ae53a40ac975bc5f7d"
          fixture = "tools/android-port/oracle/test_ci.py"
          task = ":core:database:kspDebugKotlin"
          directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "room-v4-export"
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          def unique_fields(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise RuntimeError("Duplicate JSON field: " + key)
                  value[key] = item
              return value
          def parse_json(text):
              return json.loads(text, object_pairs_hook=unique_fields)
          def validate_execution(rows, bound):
              if [row.get("phase") for row in rows] != ["before", "action-start", "action-end", "after"]:
                  raise RuntimeError("Missing/duplicate/reordered actual KSP execution observations")
              for row in rows:
                  if (row.get("task") != task or not row.get("task_type", "").startswith("com.google.devtools.ksp.gradle.")
                      or row.get("diagnostic_sha") != bound["diagnostic_sha"]
                      or row.get("run_id") != bound["run_id"] or row.get("run_attempt") != bound["run_attempt"]
                      or row.get("build_root") != str((repo / "android").resolve())
                      or row.get("project_directory") != str((repo / "android" / "core" / "database").resolve())):
                      raise RuntimeError("Unbound KSP execution observation")
              last = rows[-1]
              if (last.get("executed") is not True or last.get("did_work") is not True
                  or any(last.get(key) is not False for key in ("skipped", "up_to_date", "no_source"))
                  or last.get("skip_message") is not None or last.get("failure") is not None):
                  raise RuntimeError("KSP did not actually execute successfully without skipping/caching")
          def unlinked(path):
              for item in (path, *path.parents):
                  if item.is_symlink():
                      raise RuntimeError("Linked diagnostic input: " + str(item))
          def identity():
              head = git("rev-parse", "HEAD")
              parents = git("rev-list", "--parents", "-n", "1", "HEAD").split()
              if len(parents) != 2 or parents[0] != head:
                  raise RuntimeError("Diagnostic must have one fixture-only parent")
              fixture_parent = parents[1]
              if (head != os.environ["ROOM_DIAGNOSTIC_SHA"]
                  or os.environ["GITHUB_REPOSITORY"] != "cbattlegear/MeshCoreOne-Android"
                  or os.environ["GITHUB_EVENT_NAME"] != "workflow_dispatch"
                  or os.environ["GITHUB_REF"] != "refs/heads/diagnostic/wp003-room-v4-export-cc384ea-20261105-r1"
                  or os.environ["GITHUB_WORKFLOW_SHA"] != head
                  or os.environ["GITHUB_WORKFLOW_REF"] !=
                      "cbattlegear/MeshCoreOne-Android/.github/workflows/android-ci.yml@" + os.environ["GITHUB_REF"]
                  or git("rev-list", "--parents", "-n", "1", fixture_parent).split() != [fixture_parent, source]
                  or git("diff", "--name-only", source, fixture_parent) != fixture
                  or git("diff", "--name-only", fixture_parent, head) != workflow
                  or git("status", "--porcelain", "--", workflow, fixture)
                  or not os.environ["GITHUB_RUN_ID"].isdecimal()
                  or not os.environ["GITHUB_RUN_ATTEMPT"].isdecimal()
                  or int(os.environ["GITHUB_RUN_ATTEMPT"]) < 1):
                  raise RuntimeError("Unexpected repository/source/diagnostic/workflow/run identity")
              unlinked(repo / fixture)
              return {"repository": os.environ["GITHUB_REPOSITORY"], "source_candidate_sha": source,
                      "source_tree": git("rev-parse", source + "^{tree}"),
                      "fixture_candidate_sha": fixture_parent, "fixture_path": fixture,
                      "fixture_blob": git("rev-parse", "HEAD:" + fixture),
                      "fixture_sha256": digest((repo / fixture).read_bytes()),
                      "diagnostic_sha": head, "workflow_sha": os.environ["GITHUB_WORKFLOW_SHA"],
                      "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
                      "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                      "job": os.environ["GITHUB_JOB"]}
          def preserve_predecessors():
              for version, expected in predecessors.items():
                  target = repo / expected["path"]
                  unlinked(target)
                  if (git("rev-parse", "HEAD:" + expected["path"]) != expected["blob"]
                      or digest(target.read_bytes()) != expected["sha256"]
                      or git("status", "--porcelain", "--", expected["path"])):
                      raise RuntimeError("Genuine tracked predecessor changed: " + version)
          def read_v4(started):
              target = repo / v4
              unlinked(target)
              if (not target.is_file() or not 0 < target.stat().st_size <= 4194304
                  or target.stat().st_mtime_ns < started):
                  raise RuntimeError("Missing/empty/oversized/stale v4 export")
              data = target.read_bytes()
              value = parse_json(data)
              if (not isinstance(value, dict) or not isinstance(value.get("database"), dict)
                  or type(value["database"].get("version")) is not int
                  or value["database"]["version"] != 4):
                  raise RuntimeError("Generated schema is not numeric version 4")
              return data
          
          bound = identity()
          if os.environ["ROOM_KSP_OUTCOME"] != "success" or os.environ["ROOM_GRADLE_OUTCOME"] not in ("success", "failure"):
              raise RuntimeError("No successful dedicated KSP or no ordinary Gradle execution")
          for item in ("before.json", "compiler.json", "ksp-original.log", "task-events.jsonl", "observe-ksp.gradle"):
              unlinked(directory / item)
          guard = parse_json((directory / "before.json").read_text(encoding="utf-8"))
          receipt = parse_json((directory / "compiler.json").read_text(encoding="utf-8"))
          if (any(receipt.get(key) != value or guard.get(key) != value for key, value in bound.items())
              or receipt.get("guard") != guard or receipt.get("process_exit_code") != 0
              or guard.get("v4_absent_before") is not True or guard.get("v4_path") != v4
              or guard.get("predecessors") != predecessors
              or type(guard.get("started_ns")) is not int or guard["started_ns"] <= 0
              or receipt.get("task") != task
              or guard.get("workflow_sha256") != digest((repo / workflow).read_bytes())):
              raise RuntimeError("Stale/mismatched compiler receipt or workflow/absence guard")
          for filename, key in (("ksp-original.log", "ksp_log_sha256"), ("task-events.jsonl", "events_sha256"),
                                ("observe-ksp.gradle", "init_sha256")):
              if digest((directory / filename).read_bytes()) != receipt.get(key):
                  raise RuntimeError("Original KSP observation changed after compiler execution")
          rows = [parse_json(line) for line in (directory / "task-events.jsonl").read_text(encoding="utf-8").splitlines()]
          validate_execution(rows, bound)
          if rows != receipt.get("execution_observations"):
              raise RuntimeError("Compiler receipt disagrees with actual KSP event records")
          if (type(receipt.get("finished_ns")) is not int
              or not guard["started_ns"] <= receipt["finished_ns"] <= time.time_ns()):
              raise RuntimeError("Invalid compiler execution interval")
          preserve_predecessors()
          data = read_v4(guard["started_ns"])
          if digest(data) != receipt.get("schema_sha256") or len(data) != receipt.get("schema_size"):
              raise RuntimeError("Ordinary Gradle changed/removed the dedicated compiler's v4 export")
          log_bytes = (directory / "ksp-original.log").read_bytes()
          if not 0 < len(log_bytes) <= 16777216:
              raise RuntimeError("Missing or oversized original diagnostic compiler log")
          artifact = directory / "artifact"
          unlinked(artifact)
          artifact.mkdir(exist_ok=False)
          (artifact / "4.json").write_bytes(data)
          provenance = {**receipt, "diagnostic_only": True, "schema_path": v4, "schema_version": 4,
                        "predecessors_preserved_after": predecessors, "unchanged_after_ordinary_gradle": True,
                        "ordinary_gradle_outcome": os.environ["ROOM_GRADLE_OUTCOME"],
                        "original_log_path": "room-v4-export/ksp-original.log",
                        "original_hosted_step": "Execute fresh production Room v4 KSP",
                        "ksp_original_log_utf8": log_bytes.decode("utf-8"),
                        "task_events_jsonl": (directory / "task-events.jsonl").read_text(encoding="utf-8"),
                        "init_script_utf8": (directory / "observe-ksp.gradle").read_text(encoding="utf-8"),
                        "authority": "Diagnostic compiler execution/output custody only; not migration/product acceptance"}
          (artifact / "provenance.json").write_text(json.dumps(provenance, indent=2) + "\n", encoding="utf-8")
          print("Retained exact fresh v4 plus provenance, including original compiler log bytes")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - id: room_v4_upload
        name: Retain diagnostic Room v4 schema and provenance
        if: ${{ always() && steps.room_v4_collect.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: room-v4-export-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/room-v4-export/artifact/4.json
            ${{ runner.temp }}/room-v4-export/artifact/provenance.json
          if-no-files-found: error
          retention-days: 7

  external-oracle:
    name: Swift codec oracle
    needs: [scope]
    if: ${{ needs.scope.outputs['external-oracle'] == 'true' }}
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - name: Read-only exact candidate and frozen source objects
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.4"
      - name: Execute pinned Swift codecs and independent crypto
        run: >-
          python tools/android-port/oracle/codec_harness.py run
          --output "${{ runner.temp }}/codec"

  backup-oracle:
    name: SwiftData restore and export oracle
    needs: [scope, build]
    if: ${{ needs.scope.outputs.backup == 'true' }}
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - name: Read-only exact candidate and frozen source objects
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.4"
      - name: Download actual Kotlin-produced backup bytes
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: backup-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kotlin-input
      - name: Execute real SwiftData restore and export
        run: >-
          python tools/android-port/oracle/wp203_interop.py
          --input "${{ runner.temp }}/kotlin-input"
          --output "${{ runner.temp }}/swift-output"
          --stage-root "${{ runner.temp }}/frozen-source"

  android-ci:
    name: android-ci
    if: ${{ always() }}
    needs: [scope, controller, build, external-oracle, backup-oracle]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected scope to pass
        env:
          CONTROLLER_SELECTED: ${{ needs.scope.outputs.controller }}
          SCAFFOLD_SELECTED: ${{ needs.scope.outputs.scaffold }}
          PROTOCOL_SELECTED: ${{ needs.scope.outputs.protocol }}
          BACKUP_SELECTED: ${{ needs.scope.outputs.backup }}
          EXTERNAL_SELECTED: ${{ needs.scope.outputs['external-oracle'] }}
          CONTROLLER_RESULT: ${{ needs.controller.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          EXTERNAL_RESULT: ${{ needs.external-oracle.result }}
          BACKUP_RESULT: ${{ needs.backup-oracle.result }}
        run: |
          test "$CONTROLLER_RESULT" = "success"
          if [ "$SCAFFOLD_SELECTED" = "true" ] || [ "$PROTOCOL_SELECTED" = "true" ] || [ "$BACKUP_SELECTED" = "true" ]; then
            test "$BUILD_RESULT" = "success"
          else
            test "$BUILD_RESULT" = "skipped"
          fi
          if [ "$EXTERNAL_SELECTED" = "true" ]; then
            test "$EXTERNAL_RESULT" = "success"
          else
            test "$EXTERNAL_RESULT" = "skipped"
          fi
          if [ "$BACKUP_SELECTED" = "true" ]; then
            test "$BACKUP_RESULT" = "success"
          else
            test "$BACKUP_RESULT" = "skipped"
          fi
