          def unlinked(path):
              for item in (path, *path.parents):
                  if item.is_symlink():
                      raise RuntimeError("Linked diagnostic input: " + str(item))
          def identity():
              head = git("rev-parse", "HEAD")
              parents = git("rev-list", "--parents", "-n", "1", "HEAD").split()
              if len(parents) != 2 or parents[0] != head:
                  raise RuntimeError("Diagnostic must have one fixture-only parent")
              fixture_parent = parents[1]
              if (head != os.environ["ROOM_DIAGNOSTIC_SHA"]
                  or os.environ["GITHUB_REPOSITORY"] != "cbattlegear/MeshCoreOne-Android"
                  or os.environ["GITHUB_EVENT_NAME"] != "workflow_dispatch"
                  or os.environ["GITHUB_REF"] != "refs/heads/diagnostic/wp003-room-v4-export-cc384ea-20261105-r1"
                  or os.environ["GITHUB_WORKFLOW_SHA"] != head
