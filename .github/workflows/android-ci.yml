name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xms64m -Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"'

jobs:
  source-checks:
    name: Source and tooling checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Frozen source vectors
        run: python tools/android-port/extract_vectors.py --check
      - name: Source provenance headers
        run: python tools/android-port/portmap.py
      - name: Bundled notices
        run: python android/scaffold/sync_notices.py
      - name: Python oracle unit tests
        working-directory: tools/android-port
        run: python -m unittest discover -s oracle -t .

  build:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - name: Gradle build and tests
        working-directory: android
        env:
          JAVA_OPTS: -Xms32m -Xmx128m
        run: >-
          ./gradlew
          --no-daemon --console=plain --stacktrace
          --dependency-verification strict
          --build-cache --parallel --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
          -PscaffoldTestHeap=512m
          verifyScaffoldTests verifyRoomSchema validateModuleGraph
          runtimeDependencyInventory resolveScaffoldDependencies lintScaffold
          :app:assembleDebug :app:compileDebugAndroidTestKotlin
          :platform:notifications:testDebugUnitTest
          :core:protocol:test :core:testing:testDebugUnitTest
      - name: Localization tests were discovered and passed
        run: >-
          python tools/android-port/l10n_convert.py --check
          --verify-android-tests android/core/l10n/build/test-results/testDebugUnitTest
      - name: Inspect the debug APK
        run: python android/scaffold/inspect_apk.py
      - name: Upload debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Upload Kotlin backup export for the Swift oracle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: kotlin-backup-export
          path: android/core/data/build/reports/wp203/interop/
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-reports
          path: |
            android/**/build/test-results/**/*.xml
            android/**/build/reports/tests/**
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  swift-codec-oracle:
    name: Swift codec oracle
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Run the pinned Swift codecs and independent crypto
        run: python tools/android-port/oracle/codec_harness.py run --output "$RUNNER_TEMP/codec"

  swift-backup-oracle:
    name: SwiftData restore and export oracle
    needs: [build]
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: kotlin-backup-export
          path: ${{ runner.temp }}/kotlin-input
      - name: Restore and export with real SwiftData
        run: >-
          python tools/android-port/oracle/wp203_interop.py
          --input "$RUNNER_TEMP/kotlin-input"
          --output "$RUNNER_TEMP/swift-output"
          --stage-root "$RUNNER_TEMP/frozen-source"

  benchmark-harness:
    name: Benchmark harness (main and manual runs)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-android
        with:
          save-cache: "false"
      - name: Gradle benchmark harness
        working-directory: android
        env:
          JAVA_OPTS: -Xms32m -Xmx128m
        run: >-
          ./gradlew
          --no-daemon --console=plain --stacktrace
          --dependency-verification strict
          --build-cache --parallel --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
          -PscaffoldTestHeap=512m
          :benchmark:verifyBenchmarkHarness validateModuleGraph

  android-ci:
    name: android-ci
    if: ${{ !cancelled() }}
    needs: [source-checks, build, swift-codec-oracle, swift-backup-oracle]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job must succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "::error::A job did not succeed"; exit 1; }
          done
