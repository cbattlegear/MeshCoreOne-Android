name: Android candidate CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify candidate scopes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      controller: ${{ steps.changed.outputs.controller }}
      accessibility-suite: ${{ steps.changed.outputs.accessibility-suite }}
      scaffold: ${{ steps.changed.outputs.scaffold }}
      protocol: ${{ steps.changed.outputs.protocol }}
      backup: ${{ steps.changed.outputs.backup }}
      external-oracle: ${{ steps.changed.outputs['external-oracle'] }}
    steps:
      - name: Read-only exact candidate and immutable diff endpoints
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        name: Classify changed inputs with fail-safe defaults
        run: |
          python tools/android-port/oracle/workflow_scope.py --event-name "${{ github.event_name }}" --event-path "${{ github.event_path }}" --output "$GITHUB_OUTPUT"
          python tools/android-port/controller/test_runner.py --candidate-event-name "${{ github.event_name }}" --candidate-event-path "${{ github.event_path }}" --scope-output "$GITHUB_OUTPUT"

  controller:
    name: Controller and workflow policy
    needs: [scope]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read-only exact candidate
        if: ${{ needs.scope.outputs.controller == 'true' || needs.scope.outputs.accessibility-suite == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned Python
        if: ${{ needs.scope.outputs.controller == 'true' || needs.scope.outputs.accessibility-suite == 'true' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.4"
          architecture: x64
      - name: Install checksum-pinned YAML parser
        if: ${{ needs.scope.outputs.controller == 'true' || needs.scope.outputs.accessibility-suite == 'true' }}
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps --only-binary=:all: -r tools/android-port/controller/requirements-ci.txt --quiet
      - name: Run controller tests once
        if: ${{ needs.scope.outputs.controller == 'true' || needs.scope.outputs.accessibility-suite == 'true' }}
        run: |
          python tools/android-port/controller/test_runner.py --include-tests tools/android-port/local --include-tests android/parity-tests --include-tests tools/android-port/oracle --candidate-event-name "${{ github.event_name }}" --candidate-event-path "${{ github.event_path }}"
          python tools/android-port/controller/verification_config.py --check
          python tools/android-port/controller/validate.py
          python tools/android-port/portmap.py
          python android/parity-tests/audit.py --check
          python android/parity-tests/semantic.py --check
      - name: No controller inputs selected
        if: ${{ needs.scope.outputs.controller != 'true' && needs.scope.outputs.accessibility-suite != 'true' }}
        run: echo "Controller suite not selected."

  build:
    name: One Linux Android build
    needs: [scope]
    if: >-
      ${{
        needs.scope.outputs.scaffold == 'true' ||
        needs.scope.outputs.protocol == 'true' ||
        needs.scope.outputs.backup == 'true'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Read-only exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.4"
          architecture: x64
      - name: Install checksum-pinned workflow parser
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps --only-binary=:all: -r tools/android-port/controller/requirements-ci.txt --quiet
      - name: Declare one toolchain, work and Gradle cache root
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'meshcoreone-ci'
          "ANDROID_CI_WORK=$(Join-Path $root 'work')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_CI_STATE=$(Join-Path (Join-Path $root 'toolchain') 'environment.json')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "GRADLE_USER_HOME=$(Join-Path $root 'gradle-home')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Restore verified Gradle and task-output cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.GRADLE_USER_HOME }}
          key: android-gradle-v4-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/wrapper/gradle-wrapper.jar', 'tools/android-port/controller/toolchain-pins.json') }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/verification-metadata.xml', 'android/gradle/dependency-locks/*.lockfile', 'android/**/gradle.lockfile') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            android-gradle-v4-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/wrapper/gradle-wrapper.jar', 'tools/android-port/controller/toolchain-pins.json') }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/verification-metadata.xml', 'android/gradle/dependency-locks/*.lockfile', 'android/**/gradle.lockfile') }}-
            android-gradle-v3-${{ runner.os }}-
            android-gradle-${{ runner.os }}-
      - name: Validate frozen source inputs
        run: |
          python tools/android-port/test_inventory.py --check
          python tools/android-port/extract_vectors.py --check
      - name: Run selected Python oracle assertions
        if: ${{ needs.scope.outputs.scaffold == 'true' }}
        run: python tools/android-port/oracle/run_tests.py --output (Join-Path $env:RUNNER_TEMP 'oracle-tests.json')
      - name: Provision exact first-party JDK and SDK archives
        run: python tools/android-port/controller/ci.py provision --root (Split-Path $env:ANDROID_CI_STATE -Parent) --accept-sdk-license
      - name: Check worker readiness
        run: python tools/android-port/controller/ci.py preflight
      - id: room_absence
        name: Require absent Room v2 export before Gradle
        env:
          ROOM_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          @'
          import json, os, pathlib, subprocess, time
          root = pathlib.Path.cwd()
          target = root / "android/core/database/schemas/com.meshcoreone.android.core.database.MeshCoreDatabase/2.json"
          for path in (target, *target.parents):
              if path.is_symlink():
                  raise RuntimeError("Linked schema path; no fresh export diagnostic")
          if target.exists():
              raise RuntimeError("Schema 2.json existed before Gradle; refusing stale diagnostic without deleting it")
          tracked = subprocess.run(["git", "ls-files", "--error-unmatch", "--", str(target.relative_to(root))], capture_output=True)
          if tracked.returncode not in (0, 1):
              raise RuntimeError("Cannot establish tracked schema status")
          if tracked.returncode == 0:
              raise RuntimeError("Schema 2.json is tracked; refusing preexisting export")
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if head != os.environ["ROOM_CANDIDATE_SHA"]:
              raise RuntimeError("Schema diagnostic checkout differs from candidate")
          directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "room-schema-export"
          for path in (directory, *directory.parents):
              if path.is_symlink():
                  raise RuntimeError("Linked diagnostic directory")
          directory.mkdir(exist_ok=False)
          guard = {"candidate_sha": head, "run_id": os.environ["GITHUB_RUN_ID"],
                   "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "absent_before": True,
                   "started_ns": time.time_ns()}
          (directory / "absence.json").write_text(json.dumps(guard), encoding="utf-8")
          print("Room schema diagnostic: target absent before Gradle; no tracked schema deleted")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - id: gradle
        name: Run parallel Gradle validation and Android tasks
        env:
          RUN_SCAFFOLD: ${{ needs.scope.outputs.scaffold }}
          RUN_PROTOCOL: ${{ needs.scope.outputs.protocol }}
          RUN_BACKUP: ${{ needs.scope.outputs.backup }}
          RUN_CONTROLLER: ${{ needs.scope.outputs.controller }}
        run: |
          $scopes = @()
          if ($env:RUN_SCAFFOLD -eq 'true') { $scopes += @('--scope', 'scaffold') }
          if ($env:RUN_PROTOCOL -eq 'true') { $scopes += @('--scope', 'protocol') }
          if ($env:RUN_BACKUP -eq 'true') { $scopes += @('--scope', 'backup') }
          $affected = @()
          if ($env:RUN_CONTROLLER -ne 'true') { $affected = @('--affected-candidate') }
          & python tools/android-port/controller/ci.py run --stage scaffold @affected @scopes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate localization discovery
        if: ${{ steps.gradle.outputs.localization == 'true' }}
        run: >-
          python tools/android-port/l10n_convert.py --check
          --verify-android-tests android/core/l10n/build/test-results/testDebugUnitTest
      - name: Inspect exact APK and static alignment
        if: ${{ steps.gradle.outputs.full_scaffold == 'true' }}
        run: python tools/android-port/controller/ci.py inspect
      - name: Upload inspected debug APK for human testing
        if: ${{ success() && steps.gradle.outputs.full_scaffold == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: debug-apk-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Transfer actual backup bytes to the platform oracle
        if: ${{ needs.scope.outputs.backup == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backup-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: android/core/data/build/reports/wp203/interop/
          if-no-files-found: error
          retention-days: 1
      - id: room_schema
        name: Collect newly generated Room v2 schema diagnostic
        if: ${{ always() && steps.room_absence.outcome == 'success' && (steps.gradle.outcome == 'success' || steps.gradle.outcome == 'failure') }}
        env:
          ROOM_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ROOM_GRADLE_OUTCOME: ${{ steps.gradle.outcome }}
        run: |
          @'
          import hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path.cwd()
          relative = "android/core/database/schemas/com.meshcoreone.android.core.database.MeshCoreDatabase/2.json"
          target = root / relative
          directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "room-schema-export"
          for path in (target, *target.parents, directory, directory / "absence.json"):
              if path.is_symlink():
                  raise RuntimeError("Linked schema diagnostic input")
          guard = json.loads((directory / "absence.json").read_text(encoding="utf-8"))
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if (head != os.environ["ROOM_CANDIDATE_SHA"] or guard["candidate_sha"] != head
              or guard["run_id"] != os.environ["GITHUB_RUN_ID"]
              or guard["run_attempt"] != os.environ["GITHUB_RUN_ATTEMPT"]
              or guard["absent_before"] is not True):
              raise RuntimeError("Stale schema diagnostic identity or absence guard")
          if os.environ["ROOM_GRADLE_OUTCOME"] not in ("success", "failure"):
              raise RuntimeError("Gradle did not execute; no generated schema diagnostic")
          log_path = pathlib.Path(os.environ["ANDROID_CI_WORK"]) / "gradle-scaffold.log"
          for path in (log_path, *log_path.parents):
              if path.is_symlink():
                  raise RuntimeError("Linked Gradle diagnostic log")
          lines = log_path.read_text(encoding="utf-8").splitlines()
          task = ":core:database:kspDebugKotlin"
          observations = [line.strip() for line in lines if re.match(r"^> Task :core:database:kspDebugKotlin(?:\s|$)", line.strip())]
          if not observations or any(observation != "> Task " + task for observation in observations):
              raise RuntimeError("Missing or unsuccessful/suffixed current-run KSP task heading observation")
          if not target.is_file() or target.stat().st_size > 4194304:
              raise RuntimeError("Missing or oversized generated schema 2.json")
          if target.stat().st_mtime_ns < guard["started_ns"]:
              raise RuntimeError("Schema predates this run's absence guard")
          data = target.read_bytes()
          schema = json.loads(data)
          if type(schema.get("database", {}).get("version")) is not int or schema["database"]["version"] != 2:
              raise RuntimeError("Generated schema is not numeric version 2")
          provenance = {
              "diagnostic_only": True, "scope": "absent-before/new-output and original task-log observation; not independent compiler proof or acceptance",
              "repository": os.environ["GITHUB_REPOSITORY"], "candidate_sha": head,
              "run_id": guard["run_id"], "run_attempt": guard["run_attempt"],
              "job": os.environ["GITHUB_JOB"], "source_path": relative,
              "absent_before": True, "schema_version": 2,
              "schema_sha256": hashlib.sha256(data).hexdigest(),
              "gradle_outcome": os.environ["ROOM_GRADLE_OUTCOME"],
              "original_log_path": "gradle-scaffold.log", "task_log_headings": observations, "task_log_heading_count": len(observations),
              "task_log_scope": "Console heading displays only; repeated headings do not count executions or prove compiler completion",
          }
          (directory / "2.json").write_bytes(data)
          (directory / "provenance.json").write_text(json.dumps(provenance, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(provenance, indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - id: room_upload
        name: Retain fresh Room v2 export and provenance
        if: ${{ always() && steps.room_schema.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: room-v2-export-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/room-schema-export/2.json
            ${{ runner.temp }}/room-schema-export/provenance.json
          if-no-files-found: error
          retention-days: 7
      - name: Report Room schema diagnostic outcome
        if: ${{ always() }}
        env:
          ROOM_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ROOM_ABSENCE: ${{ steps.room_absence.outcome }}
          ROOM_COLLECTION: ${{ steps.room_schema.outcome }}
          ROOM_UPLOAD: ${{ steps.room_upload.outcome }}
        run: |
          $message = "Room schema diagnostic: absence=$env:ROOM_ABSENCE; collection=$env:ROOM_COLLECTION; upload=$env:ROOM_UPLOAD. "
          if ($env:ROOM_UPLOAD -eq 'success') {
            $message += "Schema/provenance uploaded for candidate $env:ROOM_CANDIDATE_SHA, run $env:GITHUB_RUN_ID attempt $env:GITHUB_RUN_ATTEMPT; diagnostic only, not acceptance."
          } else {
            $message += "No usable schema artifact is established. Inspect the failed/missing/skipped step and original Gradle log; no successful fallback."
            Write-Output "::warning::$message"
          }
          Write-Output $message
          $message | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  external-oracle:
    name: Swift codec oracle
    needs: [scope]
    if: ${{ needs.scope.outputs['external-oracle'] == 'true' }}
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - name: Read-only exact candidate and frozen source objects
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.4"
      - name: Execute pinned Swift codecs and independent crypto
        run: >-
          python tools/android-port/oracle/codec_harness.py run
          --output "${{ runner.temp }}/codec"

  backup-oracle:
    name: SwiftData restore and export oracle
    needs: [scope, build]
    if: ${{ needs.scope.outputs.backup == 'true' }}
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - name: Read-only exact candidate and frozen source objects
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.4"
      - name: Download actual Kotlin-produced backup bytes
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: backup-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kotlin-input
      - name: Execute real SwiftData restore and export
        run: >-
          python tools/android-port/oracle/wp203_interop.py
          --input "${{ runner.temp }}/kotlin-input"
          --output "${{ runner.temp }}/swift-output"
          --stage-root "${{ runner.temp }}/frozen-source"

  android-ci:
    name: android-ci
    if: ${{ always() }}
    needs: [scope, controller, build, external-oracle, backup-oracle]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected scope to pass
        env:
          CONTROLLER_SELECTED: ${{ needs.scope.outputs.controller }}
          SCAFFOLD_SELECTED: ${{ needs.scope.outputs.scaffold }}
          PROTOCOL_SELECTED: ${{ needs.scope.outputs.protocol }}
          BACKUP_SELECTED: ${{ needs.scope.outputs.backup }}
          EXTERNAL_SELECTED: ${{ needs.scope.outputs['external-oracle'] }}
          CONTROLLER_RESULT: ${{ needs.controller.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          EXTERNAL_RESULT: ${{ needs.external-oracle.result }}
          BACKUP_RESULT: ${{ needs.backup-oracle.result }}
        run: |
          test "$CONTROLLER_RESULT" = "success"
          if [ "$SCAFFOLD_SELECTED" = "true" ] || [ "$PROTOCOL_SELECTED" = "true" ] || [ "$BACKUP_SELECTED" = "true" ]; then
            test "$BUILD_RESULT" = "success"
          else
            test "$BUILD_RESULT" = "skipped"
          fi
          if [ "$EXTERNAL_SELECTED" = "true" ]; then
            test "$EXTERNAL_RESULT" = "success"
          else
            test "$EXTERNAL_RESULT" = "skipped"
          fi
          if [ "$BACKUP_SELECTED" = "true" ]; then
            test "$BACKUP_RESULT" = "success"
          else
            test "$BACKUP_RESULT" = "skipped"
          fi
