name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xms64m -Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"'

jobs:
  source-checks:
    name: Source and tooling checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Frozen source vectors
        run: python tools/android-port/extract_vectors.py --check
      - name: Source provenance headers
        run: python tools/android-port/portmap.py
      - name: Bundled notices
        run: python android/scaffold/sync_notices.py
      - name: Python oracle unit tests
        working-directory: tools/android-port
        run: python -m unittest discover -s oracle -t .

  build:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - name: Gradle build and tests
        working-directory: android
        env:
          JAVA_OPTS: -Xms32m -Xmx128m
        run: >-
          ./gradlew
          --no-daemon --continue --console=plain --stacktrace
          --dependency-verification strict
          --build-cache --parallel --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
          -PscaffoldTestHeap=1g
          verifyScaffoldTests verifyRoomSchema validateModuleGraph
          runtimeDependencyInventory resolveScaffoldDependencies lintScaffold
          :app:assembleDebug :app:compileDebugAndroidTestKotlin
          :platform:notifications:testDebugUnitTest
          :core:protocol:test :core:testing:testDebugUnitTest
      - name: Upload generated Room schemas
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: room-schemas
          path: android/core/database/schemas/
          if-no-files-found: warn
          retention-days: 14
      - name: Inspect the debug APK
        run: python android/scaffold/inspect_apk.py
      - name: Upload debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Upload Kotlin backup export for the Swift oracle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: kotlin-backup-export
          path: android/core/data/build/reports/wp203/interop/testDebugUnitTest/
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-reports
          path: |
            android/**/build/test-results/**/*.xml
            android/**/build/reports/tests/**
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  swift-codec-oracle:
    name: Swift codec oracle
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Run the pinned Swift codecs and independent crypto
        run: python tools/android-port/oracle/codec_harness.py run --output "$RUNNER_TEMP/codec"

  swift-backup-oracle:
    name: SwiftData restore and export oracle
    needs: [build]
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: kotlin-backup-export
          path: ${{ runner.temp }}/kotlin-input
      - name: Restore and export with real SwiftData
        run: >-
          python tools/android-port/oracle/wp203_interop.py
          --input "$RUNNER_TEMP/kotlin-input"
          --output "$RUNNER_TEMP/swift-output"
          --stage-root "$RUNNER_TEMP/frozen-source"
      - name: Upload the Swift-written backup for Room
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: swift-backup-export
          path: |
            ${{ runner.temp }}/swift-output/swift-export.meshcoreone
            ${{ runner.temp }}/swift-output/swift-export.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  swift-backup-room-restore:
    name: Restore Swift backup into Room
    needs: [swift-backup-oracle]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
        with:
          save-cache: "false"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: swift-backup-export
          path: ${{ runner.temp }}/swift-input
      - name: Verify the Swift-written backup using the Room restore test
        working-directory: android
        env:
          JAVA_OPTS: -Xms32m -Xmx128m
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/swift-input"
          test -s "$input/swift-export.meshcoreone"
          test -s "$input/swift-export.json"
          ./gradlew --no-daemon --console=plain --stacktrace \
            --dependency-verification strict --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pwp203InteropInputDir="$input" \
            :core:data:testDebugUnitTest \
            --tests 'com.meshcoreone.android.core.data.backup.BackupInteropTest.actualSwiftExportRestoresIntoRealRoomAndMatchesSourceSemantics'
          test -s core/data/build/reports/wp203/interop/testDebugUnitTest/swift-to-kotlin-room-proof.json

  v2-swift-producer:
    name: Current SwiftData v2 producer
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fetch and stage the explicit upstream revision
        run: |
          git init "$RUNNER_TEMP/wp739-upstream"
          git -C "$RUNNER_TEMP/wp739-upstream" fetch --depth=1 https://github.com/Avi0n/MeshCoreOne.git 5e980a53e077c45a1270170612fdf5dae97792ff
          git -C "$RUNNER_TEMP/wp739-upstream" checkout --detach FETCH_HEAD
          python3 tools/android-port/oracle/wp739_stage.py "$RUNNER_TEMP/wp739-upstream"
      - name: Export a v2 archive from real SwiftData
        env:
          WP739_MODE: produce
          WP739_OUTPUT: ${{ runner.temp }}/wp739-swift
        run: |
          set -o pipefail
          swift test --package-path "$RUNNER_TEMP/wp739-upstream/MC1Services" \
            --filter WP739InteropTests --verbose --parallel --num-workers 1 --disable-swift-testing \
            --xunit-output "$RUNNER_TEMP/wp739-producer.xml" --scratch-path "$RUNNER_TEMP/wp739-build" \
            2>&1 | tee "$RUNNER_TEMP/wp739-producer.log"
          python3 tools/android-port/oracle/wp739_verify.py "$RUNNER_TEMP/wp739-producer.xml" "$RUNNER_TEMP/wp739-producer.log"
          test -s "$WP739_OUTPUT/swift-v2.meshcoreone"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wp739-swift-input
          path: ${{ runner.temp }}/wp739-swift/swift-v2.meshcoreone
          if-no-files-found: error
          retention-days: 1

  v2-room-roundtrip:
    name: Current Swift v2 restore into Room
    needs: [v2-swift-producer]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
        with:
          save-cache: "false"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: wp739-swift-input
          path: ${{ runner.temp }}/wp739-input
      - name: Restore Swift v2 and export Android v1 and v2
        working-directory: android
        env:
          JAVA_OPTS: -Xms32m -Xmx128m
        run: |
          ./gradlew --no-daemon --console=plain --stacktrace \
            --dependency-verification strict --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pwp739InteropInputDir="$RUNNER_TEMP/wp739-input" \
            :core:data:testDebugUnitTest \
            --tests 'com.meshcoreone.android.core.data.backup.BackupSelfTelemetryTest.v2ArchiveRestoresIntoRoomAndProducesV1AndV2Exports'
          test -s core/data/build/reports/wp203/interop/testDebugUnitTest/android-v1.meshcoreone
          test -s core/data/build/reports/wp203/interop/testDebugUnitTest/android-v2.meshcoreone
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wp739-android-exports
          path: |
            android/core/data/build/reports/wp203/interop/testDebugUnitTest/android-v1.meshcoreone
            android/core/data/build/reports/wp203/interop/testDebugUnitTest/android-v2.meshcoreone
          if-no-files-found: error
          retention-days: 1

  v2-swift-consumer:
    name: Android v1 and v2 restore into current SwiftData
    needs: [v2-room-roundtrip]
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: wp739-android-exports
          path: ${{ runner.temp }}/wp739-input
      - name: Fetch and stage the explicit upstream revision
        run: |
          git init "$RUNNER_TEMP/wp739-upstream"
          git -C "$RUNNER_TEMP/wp739-upstream" fetch --depth=1 https://github.com/Avi0n/MeshCoreOne.git 5e980a53e077c45a1270170612fdf5dae97792ff
          git -C "$RUNNER_TEMP/wp739-upstream" checkout --detach FETCH_HEAD
          python3 tools/android-port/oracle/wp739_stage.py "$RUNNER_TEMP/wp739-upstream"
      - name: Restore Android archives into real SwiftData
        env:
          WP739_MODE: consume
          WP739_INPUT: ${{ runner.temp }}/wp739-input
          WP739_OUTPUT: ${{ runner.temp }}/wp739-swift
        run: |
          set -o pipefail
          swift test --package-path "$RUNNER_TEMP/wp739-upstream/MC1Services" \
            --filter WP739InteropTests --verbose --parallel --num-workers 1 --disable-swift-testing \
            --xunit-output "$RUNNER_TEMP/wp739-consumer.xml" --scratch-path "$RUNNER_TEMP/wp739-build" \
            2>&1 | tee "$RUNNER_TEMP/wp739-consumer.log"
          python3 tools/android-port/oracle/wp739_verify.py "$RUNNER_TEMP/wp739-consumer.xml" "$RUNNER_TEMP/wp739-consumer.log"

  benchmark-harness:
    name: Benchmark harness (main and manual runs)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-android
        with:
          save-cache: "false"
      - name: Gradle benchmark harness
        working-directory: android
        env:
          JAVA_OPTS: -Xms32m -Xmx128m
        run: >-
          ./gradlew
          --no-daemon --console=plain --stacktrace
          --dependency-verification strict
          --build-cache --parallel --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
          -PscaffoldTestHeap=512m
          :benchmark:verifyBenchmarkHarness validateModuleGraph

  android-ci:
    name: android-ci
    if: ${{ !cancelled() }}
    needs: [source-checks, build, swift-codec-oracle, swift-backup-oracle, swift-backup-room-restore]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Existing required checks must succeed (v2 diagnostics reported separately)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "::error::A job did not succeed"; exit 1; }
          done
