name: WP-003 exact-candidate six-suite diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wp003-six-suites-21495c6b-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  runner-six-suites:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.repository == 'cbattlegear/MeshCoreOne-Android' &&
        github.ref == 'refs/heads/diagnostics/wp003-runner-six-suites-21495c6b-20261105'
      }}
    name: Exact 21495c6b controller/runtime fixtures only
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CANDIDATE_SHA: 21495c6b40df071413fa777a1411c03cb842132b
      CANDIDATE_TREE: 41995fdd2aecc070d1612bac788d36d7d92a0724
      REQUIRED_HISTORY_SHA: 1e1ff70345f203b41f9a8b04836c2cc4640500c9
      WRAPPER_SHA: ${{ github.workflow_sha }}
      WRAPPER_REF: ${{ github.ref }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Read-only exact candidate with complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: cbattlegear/MeshCoreOne-Android
          ref: 21495c6b40df071413fa777a1411c03cb842132b
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate, tree and required history independently of wrapper
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git cat-file -t "$REQUIRED_HISTORY_SHA")" = commit
          test -z "$(git replace -l)"
          test -z "$(git status --porcelain=v1)"
          test "$WRAPPER_SHA" != "$CANDIDATE_SHA"
          printf 'CANDIDATE_HEAD=%s\nCANDIDATE_TREE=%s\nREQUIRED_HISTORY=%s\nDIAGNOSTIC_WRAPPER_SHA=%s\nDIAGNOSTIC_WRAPPER_REF=%s\n' \
            "$CANDIDATE_SHA" "$CANDIDATE_TREE" "$REQUIRED_HISTORY_SHA" "$WRAPPER_SHA" "$WRAPPER_REF"
      - name: Setup repository-pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.4"
          architecture: x64
      - name: Verify Python pin and install checksum-pinned CI dependencies
        run: |
          set -euo pipefail
          python -B -c 'import json, platform; from pathlib import Path; pins = json.loads(Path("tools/android-port/controller/toolchain-pins.json").read_text()); assert platform.python_version() == pins["python"] == "3.12.4"; print("Python=" + platform.python_version())'
          python -B -m pip install --disable-pip-version-check --require-hashes \
            --no-deps --only-binary=:all: \
            -r tools/android-port/controller/requirements-ci.txt --quiet
      - name: Declare fresh ephemeral toolchain and readiness directories
        run: |
          set -euo pipefail
          root="$(mktemp -d "$RUNNER_TEMP/wp003-six-suites-21495c6b.XXXXXXXX")"
          printf 'ANDROID_CI_STATE=%s/toolchain/environment.json\nANDROID_CI_OUTPUT=%s/readiness\n' \
            "$root" "$root" >> "$GITHUB_ENV"
      - name: Provision exact checksum-pinned JDK and SDK through existing CI
        run: |
          set -euo pipefail
          python -B tools/android-port/controller/ci.py provision \
            --root "$(dirname "$ANDROID_CI_STATE")" --accept-sdk-license
      - name: Configure this job with the provisioned same-host inputs
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path(os.environ["ANDROID_CI_STATE"]).read_text())
          assert state["host"] == "linux"
          private = Path(state["private_root"])
          values = {
              "JAVA_HOME": state["java_home"],
              "ANDROID_HOME": state["android_home"],
              "ANDROID_SDK_ROOT": state["android_home"],
              "GRADLE_USER_HOME": str(private / "gradle-root"),
              "ANDROID_USER_HOME": str(private / "android-user"),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              for name, value in values.items():
                  assert Path(value).is_absolute() and "\n" not in value and "\r" not in value
                  stream.write(f"{name}={value}\n")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as stream:
              stream.write(str(Path(state["java_home"]) / "bin") + "\n")
          PY
      - name: Run existing pinned-input readiness only
        run: |
          set -euo pipefail
          python -B tools/android-port/controller/ci.py preflight \
            --state "$ANDROID_CI_STATE" --output "$ANDROID_CI_OUTPUT"
      - name: Run exact strict six-suite selection and print authoritative counts
        run: |
          set -euo pipefail
          export PYTHONPATH="$(python -B -c 'import os; from pathlib import Path; print(os.pathsep.join(str(Path(root).resolve()) for root in ("tools/android-port", "tools/android-port/tests", "tools/android-port/local")))')"
          python -B -c "import unittest; from controller.test_runner import run_suite; raise SystemExit(run_suite(unittest.TestLoader().loadTestsFromNames(['test_module_junit','test_local_scope','test_repair_acceptance','test_ci','test_ci_environment','hook_test']), verbosity=0))"
      - name: Verify candidate stayed unchanged
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test -z "$(git status --porcelain=v1)"
          printf 'Candidate remains %s / %s; wrapper is %s, not the tested candidate.\n' \
            "$CANDIDATE_SHA" "$CANDIDATE_TREE" "$WRAPPER_SHA"
