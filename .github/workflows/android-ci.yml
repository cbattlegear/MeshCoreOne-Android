name: Android candidate CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ts07:
    name: Exact TS-07 affected consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PRODUCT_SHA: 7ffc76808ede1dfb8f5ae415f66ca97d80857928
      BASE_SHA: cbd8ea885f334c9e7b90443044cf3f831986555c
    steps:
      - name: Read-only exact product candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 7ffc76808ede1dfb8f5ae415f66ca97d80857928
          fetch-depth: 0
          persist-credentials: false
      - name: Verify controller bytes against trusted base
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --exit-code "$BASE_SHA" HEAD -- tools/android-port android/scaffold .github/workflows
          git diff --quiet HEAD
          printf 'PRODUCT_BINDING base=%s head=%s diagnostic=%s\n' "$BASE_SHA" "$PRODUCT_SHA" "$GITHUB_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.4"
          architecture: x64
      - name: Install checksum-pinned parser
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps --only-binary=:all: -r tools/android-port/controller/requirements-ci.txt --quiet
      - name: Declare private ephemeral roots
        shell: bash
        run: |
          echo "ANDROID_CI_WORK=$RUNNER_TEMP/ts07/work" >> "$GITHUB_ENV"
          echo "ANDROID_CI_STATE=$RUNNER_TEMP/ts07/toolchain/environment.json" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/ts07/gradle-home" >> "$GITHUB_ENV"
      - name: Restore existing verified Gradle cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.GRADLE_USER_HOME }}
          key: android-gradle-v4-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/wrapper/gradle-wrapper.jar', 'tools/android-port/controller/toolchain-pins.json') }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/verification-metadata.xml', 'android/gradle/dependency-locks/*.lockfile', 'android/**/gradle.lockfile') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            android-gradle-v4-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/wrapper/gradle-wrapper.jar', 'tools/android-port/controller/toolchain-pins.json') }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/verification-metadata.xml', 'android/gradle/dependency-locks/*.lockfile', 'android/**/gradle.lockfile') }}-
      - name: Validate source and trusted workflow boundaries
        run: |
          python tools/android-port/controller/validate.py
          python tools/android-port/portmap.py > /dev/null
          python tools/android-port/controller/workflows.py
      - name: Provision exact first-party JDK and SDK
        shell: bash
        run: python tools/android-port/controller/ci.py provision --root "$RUNNER_TEMP/ts07/toolchain" --accept-sdk-license
      - name: Check exact toolchain readiness
        run: python tools/android-port/controller/ci.py preflight
      - name: Run existing immutable affected-scope executor
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          sys.path.insert(0, str(Path("tools/android-port").resolve()))
          from controller import ci
          from controller.ci_environment import REPO, candidate_environment
          from controller.local_scope import candidate_plan, report_inputs, run_scaffold
          base, head = os.environ["BASE_SHA"], os.environ["PRODUCT_SHA"]
          assert ci.git(REPO, "rev-parse", "HEAD").decode().strip() == head
          state = ci.inputs()
          output = ci.output_directory()
          plan = candidate_plan(REPO, base, head, trusted_base=base, checkout=True)
          print("EXACT_AFFECTED_PLAN", json.dumps(plan, sort_keys=True), flush=True)
          environment = candidate_environment(state)
          options = [
              "--no-daemon", "--console=plain", "--dependency-verification", "strict",
              "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m",
              "-Pkotlin.compiler.execution.strategy=in-process", "-PscaffoldTestHeap=512m",
              "--project-cache-dir", str(Path(state["private_root"]) / "project-root"),
              "--build-cache", "--parallel", "--max-workers=2",
          ]
          def execute(command, cwd, task_environment, log):
              assert cwd == REPO
              ci.execute(command, task_environment, log, timeout=3600,
                         failure_reports=lambda: report_inputs(REPO, plan)[0], stream_output=True)
          try:
              wrapper = REPO / "android/gradlew"
              ci.execute([str(wrapper), "-p", str(REPO / "android"),
                          ":feature:remotenodes:testDebugUnitTest", "--tests",
                          "*RemoteNeighborConfidenceComposeTest", *options],
                         environment, output / "ts07-focused.log", timeout=1800, stream_output=True)
              report = run_scaffold(REPO, plan, environment, output, execute, options, trusted_base=base)
          finally:
              for xml in REPO.glob("android/feature/remotenodes/build/test-results/testDebugUnitTest/TEST-*RemoteNeighborConfidenceComposeTest.xml"):
                  suite = ET.parse(xml)
                  for case in suite.iter("testcase"):
                      for failure in list(case.findall("failure")) + list(case.findall("error")):
                          print("TS07_FAILURE_DETAIL", case.attrib, failure.attrib, failure.text, flush=True)
                  for stream in suite.iter("system-out"):
                      print("TS07_RUNNER_OUTPUT", stream.text, flush=True)
          selected = [
              case for case in report["junit_cases"]
              if case["class"].endswith("RemoteNeighborConfidenceComposeTest")
          ]
          assert len(selected) == 10, selected
          assert all(case["outcome"] == "passed" for case in selected), selected
          print("TS07_MOUNTED_CASES", json.dumps(selected, sort_keys=True), flush=True)
          print("EXACT_AFFECTED_RESULT", json.dumps({
              key: value for key, value in report.items()
              if key not in ("junit_cases", "test_lineage", "compiled_test_sources")
          }, sort_keys=True), flush=True)
          PY
