name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      focus_path:
        description: Optional changed path for a focused run; leave empty for the full suite
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xms64m -Xmx3072m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8"'

jobs:
  source-checks:
    name: Source and tooling checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      android: ${{ steps.scope.outputs.android }}
      build: ${{ steps.scope.outputs.build }}
      full: ${{ steps.scope.outputs.full }}
      app_tests: ${{ steps.scope.outputs.app_tests }}
      apk: ${{ steps.scope.outputs.apk }}
      instrumentation: ${{ steps.scope.outputs.instrumentation }}
      tasks: ${{ steps.scope.outputs.tasks }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Select expensive checks
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          FOCUS_PATH: ${{ inputs.focus_path }}
        run: |
          args=(--event "$CI_EVENT")
          case "$CI_EVENT" in
            pull_request) args+=(--base "$PR_BASE") ;;
            push) args+=(--base "$PUSH_BASE") ;;
          esac
          if [ -n "$FOCUS_PATH" ]; then args+=(--focus "$FOCUS_PATH"); fi
          python tools/android-port/ci_scope.py "${args[@]}"
      - name: Frozen source vectors
        run: python tools/android-port/extract_vectors.py --check
      - name: Source provenance headers
        run: python tools/android-port/portmap.py
      - name: Bundled notices
        run: python android/scaffold/sync_notices.py
      - name: Python oracle unit tests
        working-directory: tools/android-port
        run: |
          python -m unittest discover -s oracle -t .
          PYTHONPATH="$GITHUB_WORKSPACE:$PWD" python -m unittest docs.android.localization.test_l10n_convert.JUnitRetentionTest

  build:
    name: Linux build and tests
    needs: [source-checks]
    if: ${{ needs.source-checks.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - name: Gradle build and tests
        working-directory: android
        env:
          JAVA_OPTS: -Xms32m -Xmx128m
          CHECK_FULL: ${{ needs.source-checks.outputs.full }}
          BUILD_APK: ${{ needs.source-checks.outputs.apk }}
          COMPILE_INSTRUMENTATION: ${{ needs.source-checks.outputs.instrumentation }}
          FOCUSED_TASKS: ${{ needs.source-checks.outputs.tasks }}
        run: |
          case "$CHECK_FULL" in
            true)
              tasks=(verifyScaffoldTests validateModuleGraph runtimeDependencyInventory lintScaffold
                :app:assembleDebug :app:compileDebugAndroidTestKotlin
                :core:testing:testDebugUnitTest resolveScaffoldDependencies)
              ;;
            false)
              for selection in "$BUILD_APK" "$COMPILE_INSTRUMENTATION"; do
                case "$selection" in
                  true|false) ;;
                  *) echo "::error::Invalid focused-check selection"; exit 1 ;;
                esac
              done
              read -r -a tasks <<< "$FOCUSED_TASKS"
              if [ "$BUILD_APK" = true ]; then tasks+=(:app:assembleDebug); fi
              if [ "$COMPILE_INSTRUMENTATION" = true ]; then tasks+=(:app:compileDebugAndroidTestKotlin); fi
              [ "${#tasks[@]}" -gt 0 ] || { echo "::error::No focused Android tasks selected"; exit 1; }
              ;;
            *) echo "::error::Invalid full-suite selection"; exit 1 ;;
          esac
          printf 'Selected Gradle tasks: %s\n' "${tasks[*]}"
          ./gradlew --no-daemon --continue --console=plain --stacktrace --profile \
            --dependency-verification strict --build-cache --parallel --max-workers=3 \
            -Pkotlin.compiler.execution.strategy=in-process -PscaffoldTestHeap=1g -PscaffoldExternalAppTests=true \
            "${tasks[@]}"
      - name: Upload generated Room schemas
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: room-schemas
          path: android/core/database/schemas/
          if-no-files-found: warn
          retention-days: 14
      - name: Inspect the debug APK
        if: ${{ needs.source-checks.outputs.apk == 'true' }}
        run: python android/scaffold/inspect_apk.py
      - name: Upload debug APK
        if: ${{ needs.source-checks.outputs.apk == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Upload test results and task timings
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-reports
          path: |
            android/**/build/test-results/**/*.xml
            android/build/reports/profile/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  app-compile:
    name: Prepare app tests
    needs: [source-checks]
    if: ${{ needs.source-checks.outputs.app_tests == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - name: Compile app tests
        working-directory: android
        shell: bash
        env:
          JAVA_OPTS: -Xms32m -Xmx128m
        run: |
          ./gradlew --no-daemon --console=plain --stacktrace --profile \
            --dependency-verification strict --build-cache --parallel --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process :app:compileDebugUnitTestKotlin
      - name: Upload compilation timings
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: app-compile-profile
          path: android/build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  app-tests:
    name: App tests (${{ matrix.shard }}/5)
    needs: [source-checks, app-compile]
    if: ${{ needs.source-checks.outputs.app_tests == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-android
        with:
          save-cache: "false"
      - name: Run the assigned compiled app classes and require actual results
        working-directory: android
        env:
          JAVA_OPTS: -Xms32m -Xmx128m
          APP_TEST_SHARD: ${{ matrix.shard }}
        run: |
          ./gradlew --no-daemon --console=plain --stacktrace --profile \
            --dependency-verification strict --build-cache --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process -PscaffoldTestHeap=1g \
            -PscaffoldAppTestForks=2 -PscaffoldAppTestShard="$APP_TEST_SHARD/5" \
            verifyAppTestResults
      - name: Upload shard results and task timings
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: app-test-reports-${{ matrix.shard }}
          path: |
            android/app/build/test-results/**/*.xml
            android/build/reports/profile/
          if-no-files-found: error
          retention-days: 7

  benchmark-harness:
    name: Benchmark harness (main and manual runs)
    needs: [source-checks]
    if: ${{ needs.source-checks.outputs.full == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-android
        with:
          save-cache: "false"
      - name: Gradle benchmark harness
        working-directory: android
        env:
          JAVA_OPTS: -Xms32m -Xmx128m
        run: >-
          ./gradlew
          --no-daemon --console=plain --stacktrace
          --dependency-verification strict
          --build-cache --parallel --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
          -PscaffoldTestHeap=512m
          :benchmark:verifyBenchmarkHarness validateModuleGraph

  android-ci:
    name: android-ci
    if: ${{ !cancelled() }}
    needs: [source-checks, build, app-compile, app-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Selected Android checks must succeed
        env:
          SOURCE: ${{ needs.source-checks.result }}
          BUILD: ${{ needs.build.result }}
          APP_COMPILE: ${{ needs.app-compile.result }}
          APP_TESTS: ${{ needs.app-tests.result }}
          RUN_ANDROID: ${{ needs.source-checks.outputs.android }}
          RUN_BUILD: ${{ needs.source-checks.outputs.build }}
          RUN_APP_TESTS: ${{ needs.source-checks.outputs.app_tests }}
        run: |
          [ "$SOURCE" = success ] || { echo "::error::Source checks did not succeed"; exit 1; }
          case "$RUN_ANDROID:$RUN_BUILD:$RUN_APP_TESTS" in
            false:false:false) expected=skipped; expected_app=skipped ;;
            true:false:true) expected=skipped; expected_app=success ;;
            true:true:false) expected=success; expected_app=skipped ;;
            true:true:true) expected=success; expected_app=success ;;
            *) echo "::error::Invalid Android check selection"; exit 1 ;;
          esac
          echo "build: $BUILD (expected $expected)"
          [ "$BUILD" = "$expected" ] || { echo "::error::Android build did not produce $expected"; exit 1; }
          echo "app compilation: $APP_COMPILE (expected $expected_app)"
          [ "$APP_COMPILE" = "$expected_app" ] || { echo "::error::App compilation did not produce $expected_app"; exit 1; }
          echo "app tests: $APP_TESTS (expected $expected_app)"
          [ "$APP_TESTS" = "$expected_app" ] || { echo "::error::App tests did not produce $expected_app"; exit 1; }
