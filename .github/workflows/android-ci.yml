atabase || !selectedBuild(found[0])) {\n        throw new GradleException("Expected exactly the production KSP task in " + expectedDatabase\n            + "; observed root=" + actualRoot + "; tasks="\n            + JsonOutput.toJson(graph.allTasks.collect { [path: it.path, type: it.class.name,\n                                                         directory: it.project.projectDir.canonicalPath] }))\n    }\n    def task = found[0]\n    task.outputs.upToDateWhen { false }\n    task.outputs.cacheIf { false }\n    task.doFirst { emit(task, "action-start") }\n    task.doLast { emit(task, "action-end") }\n}\ngradle.addListener(new TaskExecutionListener() {\n    void beforeExecute(org.gradle.api.Task task) {\n        if (selectedBuild(task) && task.path == expectedTask) emit(task, "before")\n    }\n    void afterExecute(org.gradle.api.Task task, TaskState state) {\n        if (selectedBuild(task) && task.path == expectedTask) {\n            emit(task, "after", [executed: state.executed, did_work: state.didWork,\n                 skipped: state.skipped, up_to_date: state.upToDate, no_source: state.noSource,\n                 skip_message: state.skipMessage, failure: state.failure?.class?.name])\n        }\n    }\n})', encoding="utf-8")
