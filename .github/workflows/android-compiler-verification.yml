name: Independent Android compiler experiment
run-name: Independent compiler PR ${{ inputs.pull_request }} head ${{ inputs.head_sha }}

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Existing PR; no publication, merge or deployment
        required: true
        type: string
      head_sha:
        description: Exact immutable candidate head
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  compiler:
    name: Independent compiler experiment
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PR_NUMBER: ${{ inputs.pull_request }}
      CANDIDATE_HEAD: ${{ inputs.head_sha }}
    steps:
      - name: Read-only deployed verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.4"
      - name: Fetch candidate objects as data only
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 2
          [[ "$CANDIDATE_HEAD" =~ ^[a-f0-9]{40}$ ]] || exit 2
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_HEAD"
      - name: Provision pinned tools without candidate execution
        run: >-
          python tools/android-port/controller/ci.py provision
          --root "$RUNNER_TEMP/compiler-toolchain" --accept-sdk-license
      - name: Execute isolated trusted-base compiler actions
        env:
          ANDROID_PORT_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python tools/android-port/controller/compiler_verification.py run
          --pr "$PR_NUMBER" --head "$CANDIDATE_HEAD"
          --state "$RUNNER_TEMP/compiler-toolchain/environment.json"
          --output "$RUNNER_TEMP/compiler-experiment"
      - name: Report independent compiler result
        run: >-
          python tools/android-port/controller/compiler_verification.py report
          --output "$RUNNER_TEMP/compiler-experiment"
