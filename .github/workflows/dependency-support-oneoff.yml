name: One-off generated dependency support

on:
  push:
    branches:
      - "copilot/dependency-support-0ccefd-20261104"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out the exact frozen candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 0ccefd18095902403f458afa02006896f1a44e0c
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.4"
          architecture: x64

      - name: Install checksum-pinned workflow parser
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps --only-binary=:all:
          -r tools/android-port/controller/requirements-ci.txt --quiet

      - name: Bind exact source and isolated runner paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0ccefd18095902403f458afa02006896f1a44e0c"
          python - <<'PY'
          import json
          from pathlib import Path

          expected = "de5fa465e908e7f098e718082f013135b9a36ee706d032cf510f4f1153424b2a"
          pins = json.loads(Path("tools/android-port/controller/toolchain-pins.json").read_text())
          if pins.get("sdk_license_sha256") != expected:
              raise SystemExit("Pinned Android SDK license differs from the previously accepted terms")
          PY
          root="$RUNNER_TEMP/meshcoreone-generated-dependencies"
          mkdir -p "$root/evidence"
          {
            echo "ANDROID_CI_STATE=$root/toolchain/environment.json"
            echo "ANDROID_CI_OUTPUT=$root/evidence"
            echo "ANDROID_CI_WORK=$root/evidence"
          } >> "$GITHUB_ENV"

      - name: Provision exact pinned first-party JDK and SDK
        run: >-
          python tools/android-port/controller/ci.py provision
          --root "$(dirname "$ANDROID_CI_STATE")"
          --accept-sdk-license

      - name: Configure isolated toolchain environment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          from pathlib import Path
          import sys

          state = json.loads(Path(os.environ["ANDROID_CI_STATE"]).read_text())
          sys.path.insert(0, "tools/android-port")
          from controller.ci_environment import candidate_environment

          environment = candidate_environment(state)
          for name in (
              "JAVA_HOME", "ANDROID_HOME", "ANDROID_SDK_ROOT", "GRADLE_USER_HOME",
              "ANDROID_USER_HOME", "JAVA_OPTS", "GRADLE_OPTS", "PYTHONDONTWRITEBYTECODE",
          ):
              print(f"{name}={environment[name]}")
          PY
          state="$(python -c 'import json,os; print(json.load(open(os.environ["ANDROID_CI_STATE"]))["java_home"])')"
          echo "$state/bin" >> "$GITHUB_PATH"

      - name: Verify actual hosted worker readiness
        run: python tools/android-port/controller/ci.py preflight

      - id: generate
        name: Generate complete lock and SHA-256 metadata graph
        shell: bash
        run: |
          set -euo pipefail
          ./android/gradlew -p android \
            verifyScaffoldTests verifyRoomSchema validateModuleGraph \
            runtimeDependencyInventory resolveScaffoldDependencies \
            :app:assembleDebug :app:compileDebugAndroidTestKotlin lintScaffold \
            --write-locks --write-verification-metadata sha256 \
            --no-daemon --console=plain --no-build-cache --no-parallel --max-workers=2 \
            --stacktrace -Pkotlin.compiler.execution.strategy=in-process -PscaffoldTestHeap=512m

      - id: diagnostic_core_data
        name: Re-run core data tests for failure details
        if: ${{ always() && steps.generate.outcome == 'failure' }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ./android/gradlew -p android :core:data:testDebugUnitTest \
            --no-daemon --console=plain --no-build-cache --no-parallel --max-workers=2 \
            --stacktrace -Pkotlin.compiler.execution.strategy=in-process -PscaffoldTestHeap=512m
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"

      - id: diagnostics
        name: Capture failed Android test reports
        if: ${{ always() && steps.generate.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          base = "0ccefd18095902403f458afa02006896f1a44e0c"
          expected_tree = "84a115af5e58bf32108ce6e913fd9e86cfc51f3a"
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          if head != base or tree != expected_tree:
              raise SystemExit(f"Frozen checkout mismatch: {head} {tree}")

          root = Path(os.environ["RUNNER_TEMP"]) / "dependency-generation-diagnostics"
          root.mkdir(parents=True, exist_ok=False)
          copied = []
          android = Path("android")
          for build in sorted(android.rglob("build")):
              if not build.is_dir():
                  continue
              for report_dir in (build / "test-results", build / "reports" / "tests"):
                  if not report_dir.is_dir():
                      continue
                  for item in sorted(report_dir.rglob("*")):
                      if not item.is_file():
                          continue
                      if item.is_symlink():
                          raise SystemExit(f"Refusing symlinked test report: {item}")
                      relative = item.relative_to(android)
                      target = root / relative
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(item, target)
                      data = target.read_bytes()
                      copied.append({
                          "path": str(relative),
                          "size": len(data),
                          "sha256": hashlib.sha256(data).hexdigest(),
                      })

          junit = [
              item for item in copied
              if "/test-results/" in item["path"] and item["path"].endswith(".xml")
          ]
          provenance = {
              "repository": "cbattlegear/MeshCoreOne-Android",
              "workflow": "One-off generated dependency support",
              "workflow_commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job": os.environ["GITHUB_JOB"],
              "product_checkout_commit": head,
              "product_checkout_tree": tree,
              "generation_step_outcome": "failure",
              "core_data_diagnostic_step_outcome": os.environ.get(
                  "CORE_DATA_DIAGNOSTIC_OUTCOME", "unknown"
              ),
              "core_data_diagnostic_exit_code": os.environ.get(
                  "CORE_DATA_DIAGNOSTIC_EXIT_CODE", "unavailable"
              ),
              "generation_command": [
                  "./android/gradlew", "-p", "android",
                  "verifyScaffoldTests", "verifyRoomSchema", "validateModuleGraph",
                  "runtimeDependencyInventory", "resolveScaffoldDependencies",
                  ":app:assembleDebug", ":app:compileDebugAndroidTestKotlin", "lintScaffold",
                  "--write-locks", "--write-verification-metadata", "sha256",
                  "--no-daemon", "--console=plain", "--no-build-cache", "--no-parallel",
                  "--max-workers=2", "--stacktrace",
                  "-Pkotlin.compiler.execution.strategy=in-process", "-PscaffoldTestHeap=512m",
              ],
              "junit_report_count": len(junit),
              "reports": copied,
          }
          (root / "provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(provenance, indent=2, sort_keys=True))
          if not junit:
              raise SystemExit("No JUnit XML reports were produced for the failed generation run")
          PY
        env:
          CORE_DATA_DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic_core_data.outcome }}
          CORE_DATA_DIAGNOSTIC_EXIT_CODE: ${{ steps.diagnostic_core_data.outputs.exit_code }}

      - name: Upload failed Android test reports
        if: ${{ always() && steps.generate.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnostic-android-test-reports-0ccefd18095902403f458afa02006896f1a44e0c
          path: ${{ runner.temp }}/dependency-generation-diagnostics/
          if-no-files-found: warn
          retention-days: 3

      - id: strict
        name: Strict non-generation verification of the generated graph
        shell: bash
        run: |
          set +e
          python tools/android-port/controller/ci.py run --stage scaffold
          result=$?
          set -e
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"

      - id: package
        name: Package only generated dependency outputs and integrity evidence
        if: ${{ always() && steps.generate.outcome == 'success' && steps.strict.outcome == 'success' }}
        env:
          STRICT_EXIT: ${{ steps.strict.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess

          repo = Path.cwd()
          base = "0ccefd18095902403f458afa02006896f1a44e0c"
          expected_tree = "84a115af5e58bf32108ce6e913fd9e86cfc51f3a"
          if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != base:
              raise SystemExit("Candidate HEAD changed during generated dependency run")
          if subprocess.check_output(["git", "rev-parse", f"{base}^{{tree}}"], text=True).strip() != expected_tree:
              raise SystemExit("Candidate tree differs from the frozen source binding")

          def allowed(path):
              if path.startswith("android/") and path.endswith("/verification-metadata.xml"):
                  return True
              if not path.startswith("android/") or not path.endswith(".lockfile"):
                  return False
              return (
                  "/dependency-locks/" in path
                  or path.endswith("/gradle.lockfile")
                  or path.endswith("/settings.lockfile")
              )

          raw = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all", "-z"]
          )
          changed = []
          for record in raw.decode("utf-8").split("\0"):
              if not record:
                  continue
              status, path = record[:2], record[3:]
              if not allowed(path) or "D" in status or "R" in status or "C" in status:
                  raise SystemExit(f"Out-of-scope generated worktree change: {status!r} {path}")
              if Path(path).is_symlink() or not Path(path).is_file():
                  raise SystemExit(f"Unsafe generated dependency output: {path}")
              changed.append(path)
          changed = sorted(set(changed))
          if not changed:
              raise SystemExit("Generation produced no dependency lock or verification metadata changes")

          subprocess.run(["git", "add", "--", *changed], check=True)
          output_tree = subprocess.check_output(["git", "write-tree"], text=True).strip()
          subprocess.run(["git", "diff", "--check", base, "--", *changed], check=True)
          manifest_files = []
          for path in changed:
              data = (repo / path).read_bytes()
              manifest_files.append({
                  "path": path,
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })

          root = Path(os.environ["RUNNER_TEMP"]) / "dependency-support-handoff"
          if root.exists():
              raise SystemExit("Handoff directory unexpectedly already exists")
          root.mkdir(parents=True)
          patch = subprocess.check_output(
              ["git", "diff", "--binary", "--full-index", base, "--", *changed]
          )
          (root / "generated-support.patch").write_bytes(patch)
          summary = {
              "schema_version": 1,
              "repository": "cbattlegear/MeshCoreOne-Android",
              "input_commit": base,
              "input_tree": expected_tree,
              "generated_tree": output_tree,
              "generation_command": [
                  "./android/gradlew", "-p", "android",
                  "verifyScaffoldTests", "verifyRoomSchema", "validateModuleGraph",
                  "runtimeDependencyInventory", "resolveScaffoldDependencies",
                  ":app:assembleDebug", ":app:compileDebugAndroidTestKotlin", "lintScaffold",
                  "--write-locks", "--write-verification-metadata", "sha256",
                  "--no-daemon", "--console=plain", "--no-build-cache", "--no-parallel",
                  "--max-workers=2", "--stacktrace",
                  "-Pkotlin.compiler.execution.strategy=in-process", "-PscaffoldTestHeap=512m",
              ],
              "strict_command": "python tools/android-port/controller/ci.py run --stage scaffold",
              "strict_exit_code": int(os.environ["STRICT_EXIT"]),
              "strict_generation_flags_used": False,
              "outputs": manifest_files,
          }
          (root / "manifest.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload bounded generated-support handoff
        if: ${{ always() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: generated-dependency-support-0ccefd18095902403f458afa02006896f1a44e0c
          path: ${{ runner.temp }}/dependency-support-handoff/
          if-no-files-found: error
          retention-days: 3

      - name: Require strict verification success
        if: ${{ always() && steps.strict.outcome == 'success' }}
        env:
          STRICT_EXIT: ${{ steps.strict.outputs.exit_code }}
        run: test "$STRICT_EXIT" = "0"
