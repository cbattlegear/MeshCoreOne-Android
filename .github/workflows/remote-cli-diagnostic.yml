name: Remote CLI diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/remote-cli-diagnostic.yml
permissions:
  contents: read
env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xms64m -Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"'
jobs:
  mounted:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - name: Mounted blocking regression
        working-directory: android
        env:
          JAVA_OPTS: -Xms32m -Xmx128m
        run: >-
          ./gradlew --no-daemon --console=plain --stacktrace
          --dependency-verification strict --build-cache --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process -PscaffoldTestHeap=1g
          :app:testDebugUnitTest
          --tests 'com.meshcoreone.android.app.container.BlockedSenderMountedStoreTest'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ always() }}
        with:
          name: mounted-test-reports
          path: android/app/build/test-results/testDebugUnitTest/
