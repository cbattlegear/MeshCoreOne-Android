// AndroidOnly: WP-003 Reject duplicate CI-result retention from the resolved candidate task graph.
import groovy.json.JsonOutput
import org.gradle.api.tasks.AbstractExecTask

def graphTasks = []
def notificationRunners = [
    ":platform:notifications:testDebugUnitTest",
    ":platform:notifications:compileDebugAndroidTestKotlin",
]
def compilerSources = { compiler, taskPath ->
    def androidRoot = compiler.project.rootProject.projectDir.canonicalFile.toPath()
    def sources = [] as Set
    compiler.sources.files.each { source ->
        def absolute = source.toPath().toAbsolutePath().normalize()
        if (taskPath in notificationRunners &&
            source.isFile() && source.name.endsWith(".kt") && !absolute.startsWith(androidRoot)) {
            throw new GradleException("Notification Kotlin test source is outside android/: ${source}")
        }
        if (absolute.startsWith(androidRoot) && source.isFile() && source.name.endsWith(".kt")) {
            def relative = "android/" + androidRoot.relativize(absolute).toString().replace("\\", "/")
            def bytes = source.bytes
            def sha = java.security.MessageDigest.getInstance("SHA-1")
            sha.update(("blob " + bytes.length + "\u0000").getBytes("UTF-8"))
            def blob = sha.digest(bytes).encodeHex().toString()
            sources.add([path: relative, blob: blob])
        }
    }
    sources
}

gradle.beforeProject { project ->
    project.tasks.configureEach { task ->
        if (task.path == ":platform:notifications:compileDebugAndroidTestKotlin") {
            task.outputs.upToDateWhen { false }
            task.outputs.cacheIf("Notification instrumentation inputs require a fresh compiler observation") { false }
            task.doLast {
                def sourcesFile = System.getenv("ANDROID_CI_TEST_SOURCES")
                if (sourcesFile) {
                    if (!task.class.name.startsWith("org.jetbrains.kotlin.gradle.tasks.KotlinCompile")) {
                        throw new GradleException("Unsupported notification instrumentation compiler: ${task.class.name}")
                    }
                    def sources = compilerSources(task, task.path)
                    synchronized (gradle) {
                        new File(sourcesFile).append(JsonOutput.toJson([
                            task: task.path, sources: sources.sort { a, b -> a.path <=> b.path },
                        ]) + "\n", "UTF-8")
                    }
                }
            }
        }
    }
    project.tasks.withType(org.gradle.api.tasks.testing.Test).configureEach { task ->
        def lineageFile = System.getenv("ANDROID_CI_TEST_LINEAGE")
        def sourcesFile = System.getenv("ANDROID_CI_TEST_SOURCES")
        def observedTask = task.path in [":app:testDebugUnitTest", ":core:ui:testDebugUnitTest"]
        def observe = { phase ->
            if (observedTask) task.logger.quiet("WP003_TEST_INPUTS|${task.path}|${phase}")
        }
        if (sourcesFile) {
            task.doFirst {
                observe("START")
                def classDirs = task.testClassesDirs.files.collect { it.canonicalFile } as Set
                def sources = [] as Set
                def compilers = graphTasks.findAll { candidate ->
                    candidate.project == task.project &&
                        candidate.class.name.startsWith("org.jetbrains.kotlin.gradle.tasks.KotlinCompile") &&
                        candidate.outputs.files.files.any { classDirs.contains(it.canonicalFile) }
                }
                def matchedOutputs = [] as Set
                compilers.each { compiler ->
                    compiler.outputs.files.files.findAll { classDirs.contains(it.canonicalFile) }.each { output ->
                        if (!matchedOutputs.add(output.canonicalFile)) {
                            throw new GradleException("Overlapping Kotlin test compiler outputs: ${task.path}")
                        }
                    }
                }
                if (compilers.any { !it.state.executed || it.state.failure != null }) {
                    throw new GradleException("Test compiler did not complete before source observation: ${task.path}")
                }
                if (task.path == ":platform:notifications:testDebugUnitTest") {
                    def runtimeFiles = (task.classpath.files + task.testClassesDirs.files).collect {
                        it.canonicalFile
                    } as Set
                    def javaCompilers = graphTasks.findAll { candidate ->
                        candidate instanceof org.gradle.api.tasks.compile.JavaCompile &&
                            candidate.outputs.files.files.any { runtimeFiles.contains(it.canonicalFile) }
                    }
                    if (javaCompilers.any { !it.source.files.empty }) {
                        throw new GradleException("Unsupported Java compiler inputs in notification JVM runtime")
                    }
                    def unmatchedClasses = classDirs.findAll { directory ->
                        !matchedOutputs.contains(directory) && directory.isDirectory() &&
                            !task.project.fileTree(directory).matching { include("**/*.class") }.files.empty
                    }
                    if (unmatchedClasses) {
                        throw new GradleException("Unmatched notification JVM test class directories: ${unmatchedClasses}")
                    }
                }
                observe("DEPENDENCIES")
                compilers.each { compiler ->
                    sources.addAll(compilerSources(compiler, task.path))
                }
                observe("SOURCES")
                synchronized (gradle) {
                    new File(sourcesFile).append(JsonOutput.toJson([
                        task: task.path, sources: sources.sort { a, b -> a.path <=> b.path },
                    ]) + "\n", "UTF-8")
                }
                observe("END")
            }
        }
        if (observedTask) {
            task.beforeSuite { descriptor ->
                def name = descriptor.className ?: descriptor.name
                if (name ==~ /[A-Za-z_$][A-Za-z0-9_$.]*/) {
                    task.logger.quiet("WP003_TEST_SUITE|${task.path}|${name}|START")
                }
            }
            task.afterSuite { descriptor, result ->
                def name = descriptor.className ?: descriptor.name
                if (name ==~ /[A-Za-z_$][A-Za-z0-9_$.]*/) {
                    task.logger.quiet("WP003_TEST_SUITE|${task.path}|${name}|END|${result.resultType}")
                }
            }
        }
        if (lineageFile) {
            task.afterTest { descriptor, result ->
                def match = descriptor.name =~ /^(.+)\(([^()]*)\)((?:\[\d+\])+)$/
                if (result.resultType == org.gradle.api.tasks.testing.TestResult.ResultType.SUCCESS && match.matches()) {
                    def factory = match.group(1)
                    def parentName = factory + "(" + match.group(2) + ")"
                    def parent = descriptor.parent
                    while (parent && !(parent.name == parentName && parent.className == descriptor.className)) {
                        parent = parent.parent
                    }
                    if (parent) {
                        def record = [
                            task: task.path, class: descriptor.className,
                            method: descriptor.displayName, factory: factory, descriptor: descriptor.name,
                        ]
                        synchronized (gradle) {
                            new File(lineageFile).append(JsonOutput.toJson(record) + "\n", "UTF-8")
                        }
                    }
                }
            }
        }
        task.outputs.cacheIf("Only WP-203 test inputs and interop outputs are explicitly declared") {
            task.path == ":core:data:testDebugUnitTest"
        }
        if (task.path == ":core:data:testDebugUnitTest") {
            def interopOutput = project.layout.buildDirectory.dir("reports/wp203/interop").get().asFile
            task.outputs.dir(interopOutput)
            def inputPath = project.providers.gradleProperty("wp203InteropInputDir").orNull
            def interopInput = inputPath
                ? project.file(inputPath)
                : project.file("../testing/fixtures/reference-codec")
            task.inputs.dir(interopInput)
            task.doFirst {
                def expectedInput = interopInput.canonicalFile
                def inputPrefix = expectedInput.path + File.separator
                if (!task.inputs.files.files.any {
                    def path = it.canonicalFile.path
                    path == expectedInput.path || path.startsWith(inputPrefix)
                }) {
                    throw new GradleException("WP-203 interoperability fixture is not a Gradle task input")
                }
                project.delete(interopOutput)
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (System.getenv("ANDROID_CI_TEST_SOURCES")) {
        graphTasks = graph.allTasks
    }
    def output = System.getenv("ANDROID_CI_TASK_GRAPH")
    if (!output) {
        throw new GradleException("ANDROID_CI_TASK_GRAPH is required")
    }
    def backupTests = graph.allTasks.find { it.path == ":core:data:testDebugUnitTest" }
    if (backupTests) {
        def expectedOutput = new File(backupTests.project.buildDir, "reports/wp203/interop").canonicalFile
        if (!backupTests.outputs.files.files.any { it.canonicalFile == expectedOutput }) {
            throw new GradleException("WP-203 interop artifacts are not declared Gradle task outputs")
        }
    }
    def records = graph.allTasks.collect { task ->
        def command = []
        if (task instanceof AbstractExecTask) {
            command = task.commandLine.collect { it.toString() }
        }
        [path: task.path, type: task.class.name, command: command]
    }.sort { left, right -> left.path <=> right.path }
    def destination = new File(output)
    destination.parentFile.mkdirs()
    destination.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
        schema_version: 1,
        tasks: records,
    ])) + System.lineSeparator(), "UTF-8")

    def evidenceTask = ~/(?i)^(retain|collect).*evidence.*$|^verify.*evidence.*$|^(evidence|stage).*(report|result|retention).*$/
    def forbiddenTasks = records.findAll { record ->
        def name = record.path.tokenize(":").last()
        name ==~ evidenceTask
    }
    def forbiddenScripts = records.findAll { record ->
        record.command.any { argument ->
            def normalized = argument.replace("\\", "/").toLowerCase(Locale.ROOT)
            def name = normalized.tokenize("/").last()
            normalized.contains("/docs/android/evidence/") &&
                (name == "collect_evidence.py" ||
                 name == "collect_native_evidence.py" ||
                 name == "retain_raw.py" ||
                 name == "run_linux_verification.py" ||
                 name == "verify_producers.py" ||
                 name == "print_failures.py" ||
                 name == "source_bindings.py")
        }
    }
    if (forbiddenTasks || forbiddenScripts) {
        throw new GradleException(
            "Duplicate candidate evidence task graph entries: " +
            JsonOutput.toJson([tasks: forbiddenTasks*.path, scripts: forbiddenScripts*.path])
        )
    }
}
